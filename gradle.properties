# Project-wide Gradle settings.
# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
# Run in non-parallel mode to save memory
org.gradle.parallel=false
# Limit the number of workers to reduce memory pressure
org.gradle.workers.max=2
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Kotlin daemon memory
kotlin.daemon.jvm.options=-Xmx1024m
# Support for newer SDKs
android.suppressUnsupportedCompileSdk=37.1
